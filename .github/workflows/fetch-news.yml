name: Fetch AI News Daily (FC fallback)

on:
  # 北京时间每天 9:00 = UTC 1:00
  # 通过 curl 触发阿里云 FC fetch-news 函数 → 函数抓量子位 RSS → 直接上传 OSS
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发（测试用）
  workflow_dispatch:

jobs:
  trigger-fc-fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FC fetch-news function
        run: |
          URL="https://fetch-news-izkwtkwmlf.cn-hongkong.fcapp.run"
          RESP=$(curl -s -w $'\n%{http_code}' "$URL" --max-time 120)
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP status: $CODE"
          echo "Response: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::FC fetch-news failed with HTTP $CODE"
            exit 1
          fi
          # 验证 OSS 上 news.json 是否已更新
          NEWS=$(curl -s "https://www.myworkbench.me/assets/news.json" --max-time 30 | python3 -c "import sys,json; d=json.load(sys.stdin); print('updated_at='+d.get('updated_at','?'), 'items='+str(d.get('item_count',0)))" 2>/dev/null || echo "news.json 读取失败")
          echo "OSS news.json: $NEWS"
