name: Fetch AI News Daily

on:
  # 北京时间每天 9:00 = UTC 1:00
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发（测试用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch latest news from 量子位 RSS
        run: node scripts/fetch-news.js

      - name: Show diff summary
        run: |
          echo "=== assets/news.json diff ==="
          git diff --stat assets/news.json || true
          echo "=== first 3 items preview ==="
          node -e "const d=require('./assets/news.json');console.log('updated:', d.updated_at);d.items.slice(0,3).forEach(i=>console.log('-',i.category,'|',i.time,'|',i.title));"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            COMMIT_MSG="chore(news): auto-update from 量子位 RSS ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git commit -m "$COMMIT_MSG"
            git push
            echo "Pushed: $COMMIT_MSG"
          fi