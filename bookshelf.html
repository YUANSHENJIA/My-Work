<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的书架 · 小袁的工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
      <span class="font-semibold text-lg tracking-tight whitespace-nowrap">小袁的工作台</span>
    </div>
    <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
      <div class="header-ticker w-full max-w-xl" id="header-ticker">
        <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
        <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
      </button>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <!-- ===== Sidebar (injected by sidebar.js) ===== -->
  <aside class="app-sidebar"></aside>

  <main class="app-main dot-bg">
    <section class="mb-6 fade-in flex items-end justify-between flex-wrap gap-4">
      <div>
        <p class="eyebrow mb-2">Library Collection</p>
        <h1 class="headline-xl mb-2">我的书架</h1>
        <p class="body-lg text-on-surface-variant max-w-2xl">
          构建个人知识体系的基石。目前共收藏 <strong class="text-primary">14</strong> 个项目，涵盖深度阅读、行业资讯与灵感记录。
        </p>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p class="eyebrow mb-1">TOTAL ITEMS</p>
          <p class="text-3xl font-semibold">14</p>
        </div>
        <button class="btn-primary w-12 h-12 rounded-full" aria-label="添加">
          <span class="material-symbols-outlined">add</span>
        </button>
      </div>
    </section>

    <!-- Tabs -->
    <section class="flex gap-2 overflow-x-auto no-scrollbar mb-6">
      <button class="chip active">全部</button>
      <button class="chip">微信读书</button>
      <button class="chip">Medium</button>
      <button class="chip">Notion Lib</button>
      <button class="chip">RSS Feed</button>
    </section>

    <!-- 我收藏的书籍 -->
    <a href="https://yuanshenjia.github.io/meiriyixue/" target="_blank" rel="noopener noreferrer" class="card fade-in mb-6 block no-underline hover-lift" style="background: linear-gradient(135deg, var(--surface-container-low) 0%, var(--surface-container) 100%); padding: 32px;">
      <div class="flex items-center gap-6">
        <!-- 装饰封面 -->
        <div class="shrink-0 w-32 h-32 rounded-xl shadow-xl flex items-center justify-center relative" style="background: linear-gradient(135deg, #1a1c1c 0%, #3a3a3a 100%);">
          <div class="text-center px-2">
            <span class="material-symbols-outlined" style="font-size: 36px; color: rgba(255,255,255,0.4);">menu_book</span>
            <p class="text-[10px] tracking-widest font-mono mt-1" style="color: rgba(255,255,255,0.7);">每日一字</p>
          </div>
          <div class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full flex items-center justify-center shadow-lg" style="background: var(--primary); color: var(--on-primary);">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_outward</span>
          </div>
        </div>
        <!-- 文案 -->
        <div class="flex-1 min-w-0">
          <span class="chip mb-3">每日一字 · 收藏书籍</span>
          <h2 class="headline-lg mb-2" style="color: var(--on-surface);">我收藏的书籍</h2>
          <p class="body-md text-on-surface-variant mb-3">
            每日一字 · 经典读物集 — 精选好文，每日精读。<br>
            <span class="text-xs font-mono text-on-surface-variant opacity-70">yuanshenjia.github.io/meiriyixue</span>
          </p>
          <div class="flex items-center gap-3 flex-wrap">
            <span class="chip">外部链接</span>
            <span class="chip">📖 阅读收藏</span>
            <span class="text-sm text-on-surface-variant flex items-center gap-1">
              点击打开 <span class="material-symbols-outlined" style="font-size:16px;">arrow_forward</span>
            </span>
          </div>
        </div>
      </div>
    </a>

    <!-- Books grid -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="books-grid"></section>

    <div class="text-center mt-10 text-xs text-on-surface-variant">
      <p>本周目标：连续 2 本达成！</p>
    </div>
  </main>

  <script src="assets/sidebar.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const BOOKS_KEY = 'monolith.books';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function loadBooks() {
      try {
        const raw = localStorage.getItem(BOOKS_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      const seed = [
        { title: 'Generative AI and the Future of Work', author: 'Exploring the intersection of human creativity...', source: 'Medium', progress: 100, status: '已读完', color: '#f0f0f0' },
        { title: 'Morning Brew: Tech Edition', author: 'Last updated: 2 hours ago', source: 'RSS Feed', progress: 25, status: '', color: '#e8e8e8', icon: 'rss_feed' },
        { title: 'Personal Knowledge Management', author: 'Collection of notes on Zettelkasten...', source: 'Notion', progress: 40, status: '', color: '#dadada', icon: 'description' },
        { title: '置身事内：中国政府与经济发展', author: '兰小欢 · 深度阅读系列', source: '微信读书', progress: 88, status: '', color: '#d4c5a0' },
        { title: 'Atomic Habits', author: 'James Clear · 中英对照', source: '微信读书', progress: 55, status: '', color: '#c7b89c' },
        { title: 'The Pragmatic Programmer', author: 'David Thomas, Andrew Hunt', source: 'Medium', progress: 100, status: '已读完', color: '#e0e0e0' }
      ];
      try { localStorage.setItem(BOOKS_KEY, JSON.stringify(seed)); } catch(e) {}
      return seed;
    }

    let books = loadBooks();

    function saveBooks() {
      try { localStorage.setItem(BOOKS_KEY, JSON.stringify(books)); } catch(e) {}
    }

    function bookCard(b) {
      return '<article class="card hover-lift" style="position:relative;">' +
        '<button class="book-delete material-symbols-outlined" style="position:absolute; top:10px; right:10px; font-size:18px; color: var(--on-surface-variant); z-index:2;" aria-label="删除" data-title="' + escapeHtml(b.title) + '">delete</button>' +
        '<div class="aspect-video rounded-lg mb-4 flex items-center justify-center" style="background: ' + b.color + ';">' +
          (b.icon ? '<span class="material-symbols-outlined" style="font-size: 64px; color: rgba(0,0,0,0.3);">' + b.icon + '</span>' : '<span class="text-xs font-mono uppercase tracking-widest" style="color: rgba(0,0,0,0.4);">' + escapeHtml(b.source) + '</span>') +
        '</div>' +
        (b.status ? '<span class="chip mb-2">' + escapeHtml(b.status) + '</span>' : '') +
        '<h3 class="text-lg font-semibold mb-1 leading-snug">' + escapeHtml(b.title) + '</h3>' +
        '<p class="text-sm text-on-surface-variant mb-4 line-clamp-2">' + escapeHtml(b.author) + '</p>' +
        '<div class="flex items-center gap-3">' +
          '<div class="progress-bar flex-1"><div class="progress-fill" style="width: ' + b.progress + '%"></div></div>' +
          '<span class="text-sm font-mono">' + b.progress + '%</span>' +
        '</div>' +
      '</article>';
    }

    function render() {
      document.getElementById('books-grid').innerHTML = books.map(bookCard).join('');
    }

    render();

    // 删除单本书籍
    document.getElementById('books-grid').addEventListener('click', e => {
      const del = e.target.closest('.book-delete');
      if (!del) return;
      const title = del.dataset.title;
      books = books.filter(b => b.title !== title);
      saveBooks();
      render();
    });
  </script>

  <style>
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .mb-8 { margin-bottom: 32px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-10 { margin-top: 40px; }
    .p-4 { padding: 16px; }
    .p-6 { padding: 24px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .text-base { font-size: 16px; }
    .text-lg { font-size: 18px; }
    .text-2xl { font-size: 24px; }
    .text-3xl { font-size: 30px; }
    .text-on-surface { color: var(--on-surface); }
    .text-on-surface-variant { color: var(--on-surface-variant); }
    .text-primary { color: var(--primary); }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .rounded-full { border-radius: 9999px; }
    .rounded-lg { border-radius: var(--r-lg); }
    .border-outline-variant { border-color: var(--outline-variant); }
    .border-outline-variant\/30 { border-color: rgba(207, 196, 197, 0.3); }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    @media (min-width: 640px) { .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .w-8 { width: 32px; }
    .h-8 { height: 32px; }
    .w-12 { width: 48px; }
    .h-12 { height: 48px; }
    .max-w-\[180px\] { max-width: 180px; }
    .max-w-xl { max-width: 576px; }
    .max-w-2xl { max-width: 672px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .leading-snug { line-height: 1.375; }
    .tracking-tight { letter-spacing: -0.02em; }
    .tracking-widest { letter-spacing: 0.2em; }

    .transition-colors { transition: color 0.2s, background 0.2s, border 0.2s; }
    .aspect-square { aspect-ratio: 1 / 1; }
    .aspect-video { aspect-ratio: 16 / 9; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-t { border-top-width: 1px; border-top-style: solid; }
    @media (min-width: 768px) { .md\:hidden { display: none; } .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .md\:col-span-2 { grid-column: span 2 / span 2; } }
  </style>
</body>
</html>
