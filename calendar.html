<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历 · My Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
      <span class="font-semibold text-lg tracking-tight whitespace-nowrap">My Work</span>
    </div>
    <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
      <div class="header-ticker w-full max-w-xl" id="header-ticker">
        <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
        <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
      </button>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <!-- ===== Sidebar (injected by sidebar.js) ===== -->
  <aside class="app-sidebar"></aside>

  <main class="app-main dot-bg">
    <section class="mb-6 fade-in">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="eyebrow mb-2">Workstation Schedule</p>
          <h1 class="headline-xl flex items-center gap-4">
            <span id="cal-month-title">July 2026</span>
            <span class="text-outline-variant font-light" id="cal-month-short">/ 07</span>
          </h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="prev-month" class="p-2 hover:bg-surface-container rounded-full transition-colors" aria-label="上个月">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <button id="next-month" class="p-2 hover:bg-surface-container rounded-full transition-colors" aria-label="下个月">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
          <button id="today-btn" class="chip ml-2" data-i18n="backToday">回到今天</button>
        </div>
      </div>
    </section>

    <section class="card fade-in relative" style="padding: 24px;">
      <div class="absolute top-0 right-0 w-64 h-64 rounded-full blur-3xl pointer-events-none" style="background: radial-gradient(circle, rgba(0,0,0,0.04), transparent 70%);"></div>

      <div class="grid grid-cols-7 mb-4 border-b border-outline-variant/20 pb-3">
        <div class="text-center eyebrow opacity-60">SUN</div>
        <div class="text-center eyebrow opacity-60">MON</div>
        <div class="text-center eyebrow opacity-60">TUE</div>
        <div class="text-center eyebrow opacity-60">WED</div>
        <div class="text-center eyebrow opacity-60">THU</div>
        <div class="text-center eyebrow opacity-60">FRI</div>
        <div class="text-center eyebrow opacity-60">SAT</div>
      </div>
      <div id="cal-grid" class="grid grid-cols-7 gap-y-2"></div>
    </section>

    <!-- Reminder modal -->
    <div id="reminder-form-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;align-items:center;justify-content:center;">
      <div style="background:var(--surface);border-radius:var(--r-xl);padding:32px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.35);">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined" style="color:var(--primary);">notifications_active</span>
            <h3 class="headline-sm" style="font-size:20px;font-weight:600;" data-i18n="newReminder">新建提醒</h3>
          </div>
          <button id="reminder-form-close" class="p-2 rounded-full hover:bg-surface-container" aria-label="关闭">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </div>

        <form id="reminder-form" class="flex flex-col gap-4">
          <div>
            <label class="eyebrow" style="font-size:11px;display:block;margin-bottom:8px;" data-i18n="reminderContent">提醒内容</label>
            <textarea id="reminder-content" rows="3" maxlength="200" required
                      placeholder="要提醒什么？"
                      style="width:100%;padding:12px 16px;border-radius:var(--r-lg);border:1.5px solid var(--outline-variant);background:transparent;color:var(--on-surface);font-size:15px;resize:vertical;font-family:inherit;"></textarea>
          </div>
          <div>
            <label class="eyebrow" style="font-size:11px;display:block;margin-bottom:8px;" data-i18n="reminderTime">提醒时间</label>
            <input id="reminder-time" type="datetime-local" required
                   style="width:100%;padding:12px 16px;border-radius:var(--r-lg);border:1.5px solid var(--outline-variant);background:transparent;color:var(--on-surface);font-size:15px;font-family:inherit;" />
          </div>
          <div class="flex items-center justify-end gap-3 mt-2">
            <button type="button" id="reminder-cancel" class="btn-secondary text-sm py-2 px-6" data-i18n="cancel">取消</button>
            <button type="submit" class="btn-primary text-sm py-2 px-6" data-i18n="setReminder">设置提醒</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tasks for selected day -->
    <section class="card mt-6 fade-in" id="day-detail" style="display:none;">
      <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
        <div>
          <p class="eyebrow mb-2">Selected Day</p>
          <h2 class="headline-lg" id="day-detail-title">2026-07-25</h2>
        </div>
        <div class="flex items-center gap-2">
          <button id="cal-add-todo" class="btn-secondary text-sm py-2 px-4"><span class="material-symbols-outlined text-sm">add_task</span><span data-i18n="addTodo">添加待办</span></button>
          <button id="cal-add-reminder" class="btn-secondary text-sm py-2 px-4"><span class="material-symbols-outlined text-sm">notifications</span><span data-i18n="reminder">提醒</span></button>
          <a href="todos.html" class="btn-secondary text-sm py-2 px-4 no-underline" data-i18n="manageAll">管理全部</a>
        </div>
      </div>
      <ul id="day-tasks" class="flex flex-col gap-2"></ul>
      <!-- Quick add todo form (hidden by default) -->
      <div id="cal-quick-todo" class="mt-4" style="display:none;">
        <form id="cal-todo-form" class="flex items-center gap-2">
          <input type="text" id="cal-todo-input" placeholder="输入待办内容..." autocomplete="off"
                 class="flex-1 px-4 py-2.5 rounded-xl outline-none text-sm" style="background:var(--surface-container-low);color:var(--on-surface);border:1px solid var(--outline-variant);">
          <select id="cal-todo-priority" class="bg-surface-container rounded-lg px-3 py-2.5 text-sm outline-none cursor-pointer">
            <option value="priority-high">HIGH</option>
            <option value="planning">PLANNING</option>
            <option value="routine">ROUTINE</option>
          </select>
          <button type="submit" class="btn-primary text-sm py-2.5 px-4">添加</button>
          <button type="button" id="cal-todo-cancel" class="btn-secondary text-sm py-2.5 px-4">取消</button>
        </form>
      </div>
    </section>

    <p class="text-center text-sm text-on-surface-variant italic mt-10">"The secret of your future is hidden in your daily routine."</p>
  </main>

  <script src="assets/sidebar.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // 2026 中国法定节假日 / 重要节日
    const HOLIDAYS = {
      '2026-01-01': '元旦',
      '2026-02-16': '除夕', '2026-02-17': '春节', '2026-02-18': '初二', '2026-02-19': '初三',
      '2026-02-20': '初四', '2026-02-21': '初五', '2026-02-22': '初六', '2026-02-23': '初七',
      '2026-02-24': '初八',
      '2026-03-08': '妇女节',
      '2026-04-04': '清明', '2026-04-05': '清明', '2026-04-06': '清明',
      '2026-05-01': '劳动节', '2026-05-02': '劳动节', '2026-05-03': '劳动节',
      '2026-05-04': '青年节',
      '2026-06-01': '儿童节',
      '2026-06-19': '端午', '2026-06-20': '端午', '2026-06-21': '端午',
      '2026-09-10': '教师节',
      '2026-09-25': '中秋', '2026-09-26': '中秋', '2026-09-27': '中秋',
      '2026-10-01': '国庆', '2026-10-02': '国庆', '2026-10-03': '国庆',
      '2026-10-04': '国庆', '2026-10-05': '国庆', '2026-10-06': '国庆', '2026-10-07': '国庆',
      '2026-10-08': '寒露',
      '2026-12-24': '平安夜', '2026-12-25': '圣诞节',
      '2026-11-26': '感恩节'
    };

    const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTHS_NU = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

    let currentDate = new Date();
    let selectedDay = new Date();

    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function firstWeekday(year, month) {
      return new Date(year, month, 1).getDay();
    }

    function dateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function renderCalendar() {
      const y = currentDate.getFullYear();
      const m = currentDate.getMonth();
      document.getElementById('cal-month-title').textContent = `${MONTHS_EN[m]} ${y}`;
      document.getElementById('cal-month-short').textContent = `/ ${MONTHS_NU[m]}`;

      const total = daysInMonth(y, m);
      const first = firstWeekday(y, m);
      const prevDays = daysInMonth(y, m - 1);
      const grid = document.getElementById('cal-grid');
      const today = new Date();

      // Load todos to mark days with tasks
      let todos = [];
      try { todos = JSON.parse(localStorage.getItem('monolith.todos') || '[]'); } catch(e) {}
      const daysWithTasks = new Set(todos.map(t => t.date));

      // Load signed days
      let signedDays = {};
      try { signedDays = JSON.parse(localStorage.getItem('monolith.signedDays') || '{}'); } catch(e) {}
      const signedSet = new Set(Object.keys(signedDays));

      let html = '';

      // Lead-in days from prev month
      for (let i = first - 1; i >= 0; i--) {
        const d = prevDays - i;
        html += `<div class="h-28 p-2 opacity-30"><span class="font-mono text-sm">${String(d).padStart(2,'0')}</span></div>`;
      }

      // Days of current month
      for (let d = 1; d <= total; d++) {
        const k = dateKey(y, m, d);
        const isToday = (today.getFullYear() === y && today.getMonth() === m && today.getDate() === d);
        const isSelected = (selectedDay.getFullYear() === y && selectedDay.getMonth() === m && selectedDay.getDate() === d);
        const hasTask = daysWithTasks.has(k);
        const wasSigned = signedSet.has(k);
        const holiday = HOLIDAYS[k];
        const isWeekend = (new Date(y, m, d).getDay() === 0 || new Date(y, m, d).getDay() === 6);

        html += `
          <div class="group h-28 p-2 cursor-pointer transition-all relative border-r border-b border-outline-variant/10
                      ${isSelected ? 'bg-surface-container-high' : 'hover:bg-surface-container-low'}
                      ${isToday ? 'border-primary border-2' : ''}"
               data-day="${d}">
            <div class="flex justify-between items-start">
              <span class="font-mono text-sm ${isSelected || isToday ? 'text-primary font-bold' : (holiday || isWeekend) ? 'text-primary' : 'text-on-surface-variant'}">${String(d).padStart(2,'0')}</span>
              ${hasTask ? '<span class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse-dot"></span>' : ''}
            </div>
            ${holiday ? `<span class="text-[10px] mt-1 inline-block px-1.5 py-0.5 rounded font-mono ${isToday ? 'bg-primary text-on-primary' : 'bg-surface-container text-primary'}">${escapeHtml(holiday)}</span>` : ''}
            ${isSelected ? '<div class="absolute bottom-2 left-3 right-3 h-1 bg-primary rounded-full"></div>' : ''}
            ${wasSigned ? '<div class="absolute top-2 right-2 text-xs text-primary">✓</div>' : ''}
          </div>`;
      }

      // Tail days from next month
      const totalCells = first + total;
      const trailing = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        html += `<div class="h-28 p-2 opacity-30"><span class="font-mono text-sm">${String(i).padStart(2,'0')}</span></div>`;
      }

      grid.innerHTML = html;

      // bind click events
      grid.querySelectorAll('[data-day]').forEach(el => {
        el.addEventListener('click', () => {
          const d = parseInt(el.dataset.day, 10);
          selectedDay = new Date(y, m, d);
          renderCalendar();
          renderDayDetail();
        });
      });
    }

    function renderDayDetail() {
      const detail = document.getElementById('day-detail');
      const title = document.getElementById('day-detail-title');
      const tasks = document.getElementById('day-tasks');
      const k = dateKey(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate());

      detail.style.display = '';
      title.textContent = k;

      let todos = [];
      try { todos = JSON.parse(localStorage.getItem('monolith.todos') || '[]'); } catch(e) {}
      const dayTodos = todos.filter(t => t.date === k);

      if (dayTodos.length === 0) {
        tasks.innerHTML = '<li class="text-on-surface-variant text-sm">这一天还没有待办。</li>';
      } else {
        tasks.innerHTML = dayTodos.map(t => `
          <li class="flex items-center gap-3 p-3 rounded-lg hover:bg-surface-container-low">
            <span class="w-5 h-5 rounded-md border-2 ${t.done ? 'bg-primary border-primary text-on-primary' : 'border-outline-variant'} flex items-center justify-center text-xs">
              ${t.done ? '✓' : ''}
            </span>
            <span class="${t.done ? 'line-through text-on-surface-variant' : ''}">${escapeHtml(t.text)}</span>
          </li>
        `).join('');
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      currentDate = new Date();
      selectedDay = new Date();
      renderCalendar();
      renderDayDetail();
    });

    renderCalendar();
    renderDayDetail();

    // Calendar quick add todo
    document.getElementById('cal-add-todo').addEventListener('click', () => {
      document.getElementById('cal-quick-todo').style.display = 'block';
      document.getElementById('cal-todo-input').focus();
    });
    document.getElementById('cal-todo-cancel').addEventListener('click', () => {
      document.getElementById('cal-quick-todo').style.display = 'none';
    });
    document.getElementById('cal-todo-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('cal-todo-input');
      const text = input.value.trim();
      if (!text) return;
      const tag = document.getElementById('cal-todo-priority').value;
      const k = dateKey(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate());
      let allTodos;
      try { allTodos = JSON.parse(localStorage.getItem('monolith.todos') || '[]'); } catch(e) { allTodos = []; }
      allTodos.push({ id: 't' + Date.now(), text, tag, done: false, date: k, createdAt: Date.now() });
      try { localStorage.setItem('monolith.todos', JSON.stringify(allTodos)); } catch(e) {}
      document.getElementById('cal-quick-todo').style.display = 'none';
      input.value = '';
      renderCalendar();
      renderDayDetail();
    });
    // Calendar reminder (real modal: content + trigger time)
    const reminderModal = document.getElementById('reminder-form-modal');
    const reminderContent = document.getElementById('reminder-content');
    const reminderTime = document.getElementById('reminder-time');
    const reminderForm = document.getElementById('reminder-form');

    function openReminderModal() {
      // 预填时间：当前 + 30 分钟（更人性化的默认）
      const now = new Date();
      now.setMinutes(now.getMinutes() + 30);
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      reminderTime.value = `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
      reminderContent.value = '';
      reminderModal.style.display = 'flex';
      setTimeout(() => reminderContent.focus(), 100);
    }
    function closeReminderModal() {
      reminderModal.style.display = 'none';
    }

    document.getElementById('cal-add-reminder').addEventListener('click', openReminderModal);
    document.getElementById('reminder-form-close').addEventListener('click', closeReminderModal);
    document.getElementById('reminder-cancel').addEventListener('click', closeReminderModal);
    reminderModal.addEventListener('click', e => {
      if (e.target === reminderModal) closeReminderModal();
    });

    reminderForm.addEventListener('submit', e => {
      e.preventDefault();
      const content = reminderContent.value.trim();
      const timeStr = reminderTime.value;
      if (!content || !timeStr) return;
      const triggerAt = new Date(timeStr).getTime();
      // 允许最多 60 秒内的"过去"——datetime-local 是分钟精度，"当前分钟"提交时已过几秒
      if (triggerAt < Date.now() - 60000) {
        alert(((window.I18N||{})[window.getCurrentLang?window.getCurrentLang():'zh']||{}).reminderFuture || '提醒时间需在未来');
        return;
      }
      window.addReminder(content, triggerAt);
      window.requestReminderPermission(); // 顺便请求浏览器通知权限
      closeReminderModal();
      // 即时反馈：右下角小 toast
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--primary);color:var(--on-primary);padding:12px 20px;border-radius:var(--r-full);font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);';
      toast.textContent = '✅ ' + (((window.I18N||{})[window.getCurrentLang?window.getCurrentLang():'zh']||{}).reminderSet || '提醒已设置');
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    });
  </script>
