<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容摘录 · 小袁的工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
      <span class="font-semibold text-lg tracking-tight whitespace-nowrap">小袁的工作台</span>
    </div>
    <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
      <div class="header-ticker w-full max-w-xl" id="header-ticker">
        <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
        <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
      </button>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <!-- ===== Sidebar (injected by sidebar.js) ===== -->
  <aside class="app-sidebar"></aside>

  <main class="app-main dot-bg">
    <section class="mb-6 fade-in flex items-end justify-between flex-wrap gap-4">
      <div>
        <p class="eyebrow mb-2">Workspace</p>
        <h1 class="headline-xl">内容摘录</h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full" style="background: var(--surface-container);">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse-dot"></span>
          <span class="text-xs font-mono uppercase tracking-widest text-on-surface-variant">已自动保存至云端</span>
        </div>
        <button class="btn-primary" onclick="window.openModal('excerpt-modal')">
          <span class="material-symbols-outlined text-base">add</span>
          <span>新建条目</span>
        </button>
      </div>
    </section>

    <div class="flex flex-col gap-6">
      <!-- Left column: Entry list -->
      <aside class="flex flex-col gap-6">
        <div class="flex flex-col gap-4">
          <div class="relative">
            <input type="text" placeholder="搜索笔记或标签..." class="w-full px-12 py-4 rounded-2xl font-body-md outline-none" style="background: var(--surface-container-low); color: var(--on-surface);">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <span class="chip active">全部</span>
            <span class="chip">#工作</span>
            <span class="chip">#AI</span>
            <span class="chip">#灵感</span>
            <span class="chip">#阅读</span>
          </div>
        </div>

        <div id="entries-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </aside>

    </div>
  </main>

  <!-- Excerpt Modal -->
  <div class="modal-overlay" id="excerpt-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="headline-lg">新建内容摘录</h2>
        <button class="modal-close" onclick="window.closeModal('excerpt-modal')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="excerpt-form" class="flex flex-col gap-4">
        <div>
          <label class="eyebrow mb-2 block">标题</label>
          <input type="text" id="excerpt-title" placeholder="输入标题..." autocomplete="off"
                 class="w-full px-4 py-3 rounded-xl outline-none text-base" style="background:var(--surface-container-low);color:var(--on-surface);border:1px solid var(--outline-variant);">
        </div>
        <div>
          <label class="eyebrow mb-2 block">摘录内容</label>
          <textarea id="excerpt-content" rows="6" placeholder="在这里输入你的摘录..." autocomplete="off"
                    class="w-full px-4 py-3 rounded-xl outline-none resize-none text-base" style="background:var(--surface-container-low);color:var(--on-surface);border:1px solid var(--outline-variant);"></textarea>
        </div>
        <div>
          <label class="eyebrow mb-2 block">标签（逗号分隔，如 #AI, #工作）</label>
          <input type="text" id="excerpt-tags" placeholder="#AI, #工作" autocomplete="off"
                 class="w-full px-4 py-3 rounded-xl outline-none text-sm" style="background:var(--surface-container-low);color:var(--on-surface);border:1px solid var(--outline-variant);">
        </div>
        <div class="flex justify-end gap-3 mt-2">
          <button type="button" class="btn-secondary text-sm py-2 px-4" onclick="window.closeModal('excerpt-modal')">取消</button>
          <button type="submit" class="btn-primary text-sm py-2 px-4">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="headline-lg" id="detail-title">标题</h2>
        <button class="modal-close" onclick="window.closeModal('detail-modal')">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="flex flex-col gap-4" style="padding: 24px;">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-xs font-mono uppercase tracking-widest text-on-surface-variant" id="detail-date"></span>
          <div id="detail-tags" class="flex gap-2"></div>
        </div>
        <p class="text-base leading-relaxed" id="detail-content" style="color: var(--on-surface);"></p>
      </div>
    </div>
  </div>

  <script src="assets/sidebar.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const ENTRIES_KEY = 'monolith.excerpts';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function loadEntries() {
      try {
        const raw = localStorage.getItem(ENTRIES_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      const seed = [
        { date: '2026.07.25', title: '大语言模型幻觉问题的深度复盘', excerpt: '今天在处理复杂逻辑推理时，发现模型在多层嵌套条件下容易出现事实性错误。引入 COT 引导模型分步思考，显著降低了逻辑错误率。', tags: ['#AI', '#工作'], active: true },
        { date: '2026.07.24', title: '《黑客与画家》片段摘录', excerpt: '"创造优美事物的方式，往往是修复丑陋的事物。" 这句话对设计系统开发的启发非常大：真正的搜索应当观察记录来看是一个被反复优化的实验。', tags: ['#阅读', '#灵感'] },
        { date: '2026.07.23', title: '新项目成本效益分析', excerpt: '初步估算显示，自动化工作流可以将重复性劳动的资源占用降低约40%。把语言模型与端到端工具结合，使搜索能扩展为主语境的"媒介"。', tags: ['#工作'] }
      ];
      try { localStorage.setItem(ENTRIES_KEY, JSON.stringify(seed)); } catch(e) {}
      return seed;
    }

    let entries = loadEntries();

    function saveEntries() {
      try { localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); } catch(e) {}
    }

    function cardHtml(e) {
      return '<div class="p-6 rounded-2xl cursor-pointer transition-all ' + (e.active ? 'shadow-sm border-l-4' : 'hover:bg-surface-container-low') + '"' +
        ' style="' + (e.active ? 'background: var(--surface-container-lowest); border-color: var(--primary);' : 'background: rgba(243,243,243,0.5);') + '"' +
        ' data-key="' + escapeHtml(e.date + '|' + e.title) + '">' +
        '<div class="flex justify-between items-start mb-2">' +
          '<span class="text-xs font-mono uppercase tracking-widest text-on-surface-variant">' + escapeHtml(e.date) + '</span>' +
          '<button class="excerpt-delete material-symbols-outlined text-base text-on-surface-variant" aria-label="删除" data-key="' + escapeHtml(e.date + '|' + e.title) + '">delete</button>' +
        '</div>' +
        '<h3 class="text-xl font-semibold mb-2 line-clamp-1">' + escapeHtml(e.title) + '</h3>' +
        '<p class="text-sm text-on-surface-variant line-clamp-2 mb-3">' + escapeHtml((e.excerpt || '').substring(0, 50) + ((e.excerpt || '').length > 50 ? '...' : '')) + '</p>' +
        '<div class="flex gap-2">' + e.tags.map(function(t) { return '<span class="text-xs font-mono text-on-surface-variant">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
      '</div>';
    }

    function render() {
      document.getElementById('entries-list').innerHTML = entries.map(cardHtml).join('');
    }

    render();

    // 删除单条摘录
    document.getElementById('entries-list').addEventListener('click', e => {
      const del = e.target.closest('.excerpt-delete');
      if (!del) return;
      const key = del.dataset.key;
      entries = entries.filter(x => (x.date + '|' + x.title) !== key);
      saveEntries();
      render();
    });

    // 点击卡片展开详情弹窗
    document.getElementById('entries-list').addEventListener('click', e => {
      if (e.target.closest('.excerpt-delete')) return; // 跳过删除按钮的点击
      const card = e.target.closest('[data-key]');
      if (!card) return;
      const key = card.dataset.key;
      const entry = entries.find(x => (x.date + '|' + x.title) === key);
      if (!entry) return;
      document.getElementById('detail-title').textContent = entry.title;
      document.getElementById('detail-date').textContent = entry.date;
      document.getElementById('detail-content').textContent = entry.excerpt || '(无内容)';
      document.getElementById('detail-tags').innerHTML = entry.tags.map(t => '<span class="chip">' + escapeHtml(t) + '</span>').join('');
      window.openModal('detail-modal');
    });

    // Excerpt form handler
    document.getElementById('excerpt-form').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('excerpt-title').value.trim();
      const content = document.getElementById('excerpt-content').value.trim();
      const tags = document.getElementById('excerpt-tags').value.trim();
      if (!title) { alert('请输入标题'); return; }
      const now = new Date();
      const dateKey = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
      const tagList = tags ? tags.split(',').map(t => t.trim()).filter(Boolean) : [];
      const newEntry = {
        date: dateKey,
        title,
        excerpt: content,
        tags: tagList.length ? tagList : ['#未分类'],
        active: false
      };
      entries.unshift(newEntry);
      saveEntries();
      render();
      window.closeModal('excerpt-modal');
      document.getElementById('excerpt-form').reset();
    });
  </script>
