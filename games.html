<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>摸鱼小游戏 · My Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="app-header">
  <div class="flex items-center gap-2">
    <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
    <span class="font-semibold text-lg tracking-tight whitespace-nowrap">My Work</span>
  </div>
  <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
    <div class="header-ticker w-full max-w-xl" id="header-ticker">
      <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
    </div>
  </div>
  <div class="flex items-center gap-1 shrink-0">
    <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
      <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
    </button>
  </div>
</header>

<div class="app-layout">
  <aside class="app-sidebar"></aside>
  <main class="app-main">

    <div class="flex items-center gap-2 text-sm text-on-surface-variant mb-4 fade-in">
      <span class="material-symbols-outlined text-base">sports_esports</span>
      <span><span data-i18n="workspace">Workspace</span> · <span data-i18n="gamesTitle">摸鱼小游戏</span></span>
    </div>

    <h2 class="headline-lg mb-1 fade-in" data-i18n="gamesTitle">摸鱼小游戏</h2>
    <p class="body-md text-on-surface-variant mb-6 fade-in" data-i18n="gamesSubtitle">适度放松，效率更高 😄</p>

    <!-- Tab bar -->
    <div class="tab-bar fade-in" style="justify-content:center;">
      <button class="tab-btn active" data-tab="wooden-fish" data-i18n="tabFish">电子木鱼</button>
    </div>

    <!-- Wooden Fish -->
    <div class="tab-pane card active" id="tab-wooden-fish" style="text-align:center;">
      <div id="fish-wrap" style="width:220px;height:170px;margin:48px auto 16px;cursor:pointer;touch-action:manipulation;user-select:none;position:relative;">
        <div id="fish" style="width:100%;height:100%;border-radius:0;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.56,.64,1);overflow:visible;">
          🐟
        </div>
        <div id="mallet" style="position:absolute;top:-30px;right:-30px;width:128px;height:128px;pointer-events:none;transform-origin:50% 80%;transition:transform .35s cubic-bezier(.34,1.56,.64,1);">
          <img src="assets/images/mallet.png" alt="锤子" style="width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;">
        </div>
        <div id="float-layer" style="position:absolute;left:0;right:0;top:-32px;height:32px;pointer-events:none;overflow:visible;"></div>
      </div>
      <div style="font-size:14px;color:var(--on-surface-variant);margin-bottom:8px;">总功德</div>
      <div style="font-size:32px;font-weight:800;display:block;margin-bottom:12px;" id="deed">0</div>
      <button id="wf-reset" class="btn-secondary text-sm py-2 px-4">重置总功德</button>
    </div>

  </main>
</div>

<script src="assets/sidebar.js"></script>
<script src="assets/app.js"></script>
<style>
.tab-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;background:var(--surface-container);padding:6px;border-radius:9999px}
.tab-btn{padding:10px 20px;border:none;background:transparent;border-radius:9999px;font-size:14px;font-weight:500;cursor:pointer;color:var(--on-surface-variant);transition:all .2s}
.tab-btn.active{background:var(--primary);color:var(--on-primary)}
.tab-btn:hover:not(.active){background:var(--surface-container-high)}
.tab-pane{display:none}
.tab-pane.active{display:block}
.mine-cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-radius:var(--r-sm);cursor:pointer;user-select:none;transition:background .1s;background:var(--surface-container)}
.mine-cell:hover{filter:brightness(.92)}
.mine-cell.revealed{background:var(--surface-container-lowest);cursor:default}
.mine-cell.mine{background:var(--error-container)}
.mine-cell.flagged{background:var(--surface-container-high)}
#fish:active,#fish.hit{transform:scale(.85)}
/* 飘字：每敲一次，从木鱼上方空白区浮起 + 透明度 1→0 + 微缩放 */
@keyframes floatUp{
  0%   { transform: translate(-50%, 0) scale(.85); opacity: 0; }
  15%  { transform: translate(-50%, -8px) scale(1); opacity: .85; }
  100% { transform: translate(-50%, -56px) scale(.95); opacity: 0; }
}
.float-deed{
  position:absolute; left:50%; top:0;
  font-size:14px; font-weight:400;
  color:var(--primary); opacity:.7;
  font-family:'Geist','Inter',sans-serif; font-feature-settings:'tnum';
  animation: floatUp 1.1s cubic-bezier(.2,.7,.3,1) forwards;
  pointer-events:none; user-select:none; white-space:nowrap;
  letter-spacing:.06em;
}
</style>
<script>
/* =================================================================
   工具
   ================================================================= */
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const pane=document.getElementById('tab-'+b.dataset.tab);
    pane.classList.add('active');
    if(b.dataset.tab==='snake')snakeDraw();
    if(b.dataset.tab==='gomoku')gomoDraw();
  });
});







/* =================================================================
   电子木鱼
   ================================================================= */
(function(){
  const KEY='monolith.woodenFish';
  let total=0;

  function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');total=raw.total||0;}catch(e){total=0}updateUI();}
  function save(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}')||{};raw.total=total;localStorage.setItem(KEY,JSON.stringify(raw));}catch(e){}}
  function updateUI(){document.getElementById('deed').textContent=total;}

  /* ===== 木鱼合成音（Web Audio API）=====
     简洁的"咚"声：单频正弦 + 瞬态噪声包络
     频率 ~660Hz (E5)，短促衰减 */
  let audioCtx=null;
  function playTok(){
    try{
      if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended')audioCtx.resume();
      const t=audioCtx.currentTime;
      const ctx=audioCtx;
      const master=ctx.createGain();master.gain.value=0.7;master.connect(ctx.destination);

      // 主音：清脆的"咚"
      const o=ctx.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(660,t);
      o.frequency.exponentialRampToValueAtTime(440,t+0.18);
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.9,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g).connect(master);
      o.start(t);o.stop(t+0.25);

      // 谐波：让音色更"木"
      const o2=ctx.createOscillator();o2.type='triangle';
      o2.frequency.setValueAtTime(880,t);
      const g2=ctx.createGain();
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.25,t+0.002);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
      o2.connect(g2).connect(master);
      o2.start(t);o2.stop(t+0.15);

      // 噪声脉冲：敲击瞬态（极短，5ms）
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate);
      const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
      const noise=ctx.createBufferSource();noise.buffer=buf;
      const ng=ctx.createGain();ng.gain.value=0.18;
      noise.connect(ng).connect(master);
      noise.start(t);
    }catch(e){}
  }

  function knock(){
    total++;
    const fish=document.getElementById('fish');
    const mallet=document.getElementById('mallet');
    // 鱼缩放（弹性回到原位）
    fish.style.transform='scale(0.86)';
    setTimeout(()=>{fish.style.transform='scale(1)';},120);
    // 锤子挥动：拉起 → 落下（用两次帧切换形成挥动节奏）
    mallet.style.transition='transform .08s ease-out';
    mallet.style.transform='rotate(-35deg)';
    setTimeout(()=>{
      mallet.style.transition='transform .12s cubic-bezier(.34,1.56,.64,1)';
      mallet.style.transform='rotate(18deg)';
      setTimeout(()=>{
        mallet.style.transition='transform .4s ease-out';
        mallet.style.transform='rotate(0deg)';
      },260);
    },90);
    // 飘字：功德+1 从木鱼中心向上浮起 + 淡出
    const layer=document.getElementById('float-layer');
    const ft=document.createElement('div');
    ft.className='float-deed';
    // 随机水平偏移，避免每次都堆在正中
    ft.style.left=(50+(Math.random()*20-10))+'%';
    ft.textContent='功德+1';
    layer.appendChild(ft);
    setTimeout(()=>{ft.remove();},1000);
    // 音效
    playTok();
    updateUI();
    save();
  }

  const fishEl=document.getElementById('fish');
  const img=new Image();
  img.onload=()=>{fishEl.innerHTML='<img src="assets/images/wooden-fish.png" alt="木鱼" style="width:100%;height:100%;object-fit:contain;">';};
  img.onerror=()=>{fishEl.textContent='🐟';};
  img.src='assets/images/wooden-fish.png';

  document.getElementById('fish-wrap').addEventListener('click',knock);
  document.addEventListener('keydown',e=>{if(!document.getElementById('tab-wooden-fish').classList.contains('active'))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();knock()}});
  document.getElementById('wf-reset').addEventListener('click',()=>{if(!confirm('确定要重置总功德吗？'))return;total=0;try{localStorage.setItem(KEY,JSON.stringify({total:0}));}catch(e){}updateUI();});
  load();
})();

// Login guard
(function(){try{var n=localStorage.getItem('monolith.userName');if(!n)location.href='login.html';}catch(e){}})();
</script>
</body>
</html>
