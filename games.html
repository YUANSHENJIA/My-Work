<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>摸鱼小游戏 · My Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;padding:16px}
.game-card{background:var(--surface-container-low);border-radius:var(--r-xl);padding:24px;max-width:540px;width:100%;text-align:center}
h2{font-size:22px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;background:var(--surface-container);padding:6px;border-radius:9999px}
.tab-btn{padding:10px 20px;border:none;background:transparent;border-radius:9999px;font-size:14px;font-weight:500;cursor:pointer;color:var(--on-surface-variant);transition:all .2s}
.tab-btn.active{background:var(--primary);color:var(--on-primary)}
.tab-btn:hover:not(.active){background:var(--surface-container-high)}
.tab-pane{display:none}
.tab-pane.active{display:block}
/* Snake */
#snake-info{font-size:14px;color:var(--on-surface-variant);margin-bottom:12px}
#snake-status{font-size:15px;font-weight:500;margin-top:12px;min-height:24px}
/* Minesweeper */
#mine-info{font-size:14px;color:var(--surface);margin-bottom:12px}
#mine-info>*{color:var(--on-surface-variant);font-weight:600}
#mine-grid{display:grid;gap:2px;margin:0 auto;justify-content:center;touch-action:manipulation}
.mine-cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-radius:var(--r-sm);cursor:pointer;user-select:none;transition:background .1s}
.mine-cell:hover{filter:brightness(.92)}
.mine-cell.revealed{cursor:default}
.mine-cell.mine{}
.mine-cell.flagged{}
#mine-status{font-size:15px;font-weight:500;min-height:24px;margin-top:10px}
.mine-controls{margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* Gomoku */
#gomo-info{font-size:14px;margin-bottom:8px}
#gomo-turn{font-weight:600}
canvas{display:block;margin:0 auto;border-radius:var(--r-lg);max-width:100%;cursor:pointer;touch-action:manipulation}
#gomo-status{font-size:15px;font-weight:500;min-height:24px;margin-top:10px}
.gomo-controls{margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* Wooden fish */
#wf-status-bar{font-size:13px;color:var(--on-surface-variant);margin-bottom:8px}
#fish-wrap{position:relative;width:200px;height:200px;margin:0 auto 20px;cursor:pointer;touch-action:manipulation;user-select:none}
#fish{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:96px;background:var(--surface-container-high);transition:transform .12s;overflow:hidden}
#fish:active{transform:scale(.85)}
#fish.hit{transform:scale(.85)}
#fish img{width:100%;height:100%;object-fit:contain}
#deed{font-size:48px;font-weight:800;display:block;margin-bottom:4px}
#deed-label{font-size:14px;color:var(--on-surface-variant);margin-bottom:20px}
#wf-phrase{font-size:18px;font-weight:500;min-height:40px;margin-bottom:8px;transition:opacity .2s}
#wf-phrase.fade{opacity:0}
.wf-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tab-controls{margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>

<div class="game-card">
  <h2><span class="material-symbols-outlined" style="font-size:28px;">sports_esports</span>摸鱼小游戏</h2>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="snake">贪吃蛇</button>
    <button class="tab-btn" data-tab="minesweeper">扫雷</button>
    <button class="tab-btn" data-tab="gomoku">五子棋</button>
    <button class="tab-btn" data-tab="wooden-fish">电子木鱼</button>
  </div>

  <!-- Snake -->
  <div class="tab-pane active" id="tab-snake">
    <p id="snake-info">当前得分：0 &nbsp;|&nbsp; 最高纪录：<span id="snake-best">0</span></p>
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <p id="snake-status"></p>
    <div class="tab-controls">
      <button id="snake-restart" class="btn-primary text-sm py-2 px-6">重新开始</button>
    </div>
  </div>

  <!-- Minesweeper -->
  <div class="tab-pane" id="tab-minesweeper">
    <p id="mine-info">💣 <span id="mine-count">10</span> · 🚩 <span id="flag-count">0</span></p>
    <div id="mine-grid"></div>
    <p id="mine-status"></p>
    <div class="mine-controls">
      <button id="flag-btn" class="btn-secondary text-sm py-2 px-4">🚩 标记模式 (关)</button>
      <button id="mine-restart" class="btn-primary text-sm py-2 px-6">重新开始</button>
    </div>
  </div>

  <!-- Gomoku -->
  <div class="tab-pane" id="tab-gomoku">
    <p id="gomo-info">当前：<span id="gomo-turn">⚫ 黑棋</span> · 模式：本地双人对弈</p>
    <canvas id="gomo-canvas" width="450" height="450"></canvas>
    <p id="gomo-status"></p>
    <div class="gomo-controls">
      <button id="gomo-restart" class="btn-primary text-sm py-2 px-6">重新开始</button>
    </div>
  </div>

  <!-- Wooden Fish -->
  <div class="tab-pane" id="tab-wooden-fish">
    <p id="wf-status-bar">今日功德：<span id="wf-today">0</span></p>
    <div id="fish-wrap">
      <div id="fish">🐟</div>
    </div>
    <span id="deed">0</span>
    <span id="deed-label">总功德</span>
    <p id="wf-phrase">点击木鱼，敲一敲 🎵</p>
    <div class="wf-controls">
      <button id="wf-reset" class="btn-secondary text-sm py-2 px-4">重置总功德</button>
    </div>
  </div>

</div>

<script>
/* =================================================================
   工具：读 CSS 变量（canvas 不能直接用 var(--xxx)）
   ================================================================= */
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    // 切换到画布时重绘（防止 canvas 上下文丢失）
    if(b.dataset.tab==='snake')snakeDraw();
    if(b.dataset.tab==='gomoku')gomoDraw();
  });
});

/* =================================================================
   贪吃蛇
   ================================================================= */
(function(){
  const canvas=document.getElementById('snake-canvas'),ctx=canvas.getContext('2d');
  const CELL=20,ROWS=20,COLS=20,TICK=180;
  let snake,direction,nextDir,food,score,gameOver,loop,best;

  window.snakeInit=function(){
    snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    direction={x:1,y:0};nextDir={x:1,y:0};score=0;gameOver=false;
    snakeSpawnFood();
    best=parseInt(localStorage.getItem('monolith.snakeBest')||'0');
    document.getElementById('snake-best').textContent=best;
    document.getElementById('snake-info').textContent='当前得分：0 | 最高纪录：'+best;
    document.getElementById('snake-status').textContent='按方向键开始';
    if(loop)clearInterval(loop);
    snakeDraw();
    loop=setInterval(snakeTick,TICK);
  };

  function snakeSpawnFood(){
    let pos;do{
      pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    }while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
    food=pos;
  }

  function snakeTick(){
    if(gameOver)return;
    direction={...nextDir};
    const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver=true;document.getElementById('snake-status').textContent='💀 游戏结束！得分：'+score;
      clearInterval(loop);
      if(score>best){best=score;localStorage.setItem('monolith.snakeBest',String(best));document.getElementById('snake-best').textContent=best}
      snakeDraw();return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score++;snakeSpawnFood();document.getElementById('snake-info').textContent='当前得分：'+score+' | 最高纪录：'+best}
    else snake.pop();
    snakeDraw();
  }

  window.snakeDraw=function(){
    const bg=cssVar('--surface-container'),bgAlt=cssVar('--surface'),
          head=cssVar('--primary'),body=cssVar('--on-surface-variant'),
          foodColor=cssVar('--error');
    ctx.clearRect(0,0,400,400);
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
      ctx.fillStyle=(i+j)%2===0?bg:bgAlt;
      ctx.fillRect(j*CELL,i*CELL,CELL,CELL);
    }
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?head:body;
      if(i===0){ctx.shadowBlur=10;ctx.shadowColor=head;}
      ctx.beginPath();ctx.arc(s.x*CELL+10,s.y*CELL+10,9,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    });
    ctx.fillStyle=foodColor;
    ctx.beginPath();ctx.arc(food.x*CELL+10,food.y*CELL+10,8,0,Math.PI*2);ctx.fill();
  };

  document.addEventListener('keydown',e=>{
    if(!document.getElementById('tab-snake').classList.contains('active'))return;
    const ks={'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0}};
    if(ks[e.key]){
      e.preventDefault();
      if(direction.x+ks[e.key].x!==0||direction.y+ks[e.key].y!==0)nextDir=ks[e.key];
    }
  });
  let sx=0,sy=0;
  canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
  canvas.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    let d;if(Math.abs(dx)>Math.abs(dy))d=dx>0?{x:1,y:0}:{x:-1,y:0};else d=dy>0?{x:0,y:1}:{x:0,y:-1};
    if(direction.x+d.x!==0||direction.y+d.y!==0)nextDir=d;
  });
  document.getElementById('snake-restart').addEventListener('click',snakeInit);
  snakeInit();
})();

/* =================================================================
   扫雷
   ================================================================= */
(function(){
  const ROWS=9,COLS=9,TOTAL_MINES=10;
  let board=[],revealed=[],flags={},flagMode=false,gameOver=false,firstClick=true,win=false;

  function init(){
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    flags={};gameOver=false;firstClick=true;win=false;
    document.getElementById('flag-btn').textContent='🚩 标记模式 (关)';flagMode=false;
    document.getElementById('mine-count').textContent=TOTAL_MINES;
    document.getElementById('flag-count').textContent='0';
    document.getElementById('mine-status').textContent='';
    mineRender();
  }

  function placeMines(safeX,safeY){
    let placed=0;
    while(placed<TOTAL_MINES){
      const x=Math.floor(Math.random()*ROWS),y=Math.floor(Math.random()*COLS);
      if(board[x][y]===-1||(Math.abs(x-safeX)<=1&&Math.abs(y-safeY)<=1))continue;
      board[x][y]=-1;placed++;
    }
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
      if(board[i][j]===-1)continue;
      let c=0;
      for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
        const ni=i+di,nj=j+dj;
        if(ni>=0&&ni<ROWS&&nj>=0&&nj<COLS&&board[ni][nj]===-1)c++;
      }
      board[i][j]=c;
    }
  }

  function reveal(x,y){
    if(x<0||x>=ROWS||y<0||y>=COLS||revealed[x][y]||flags[x+'-'+y])return;
    revealed[x][y]=true;
    if(board[x][y]===-1){
      gameOver=true;
      document.getElementById('mine-status').textContent='💥 踩雷了！';
      revealAllMines();
      mineRender();return;
    }
    if(board[x][y]===0)for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++)reveal(x+di,y+dj);
    checkWin();
    mineRender();
  }

  function revealAllMines(){
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(board[i][j]===-1)revealed[i][j]=true;
  }

  function checkWin(){
    let unrevealed=0;
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(!revealed[i][j]&&board[i][j]!==-1)unrevealed++;
    if(unrevealed===0&&!gameOver){
      win=true;gameOver=true;
      document.getElementById('mine-status').textContent='🎉 你赢了！';
    }
  }

  function mineRender(){
    const grid=document.getElementById('mine-grid');
    grid.style.gridTemplateColumns=`repeat(${COLS},36px)`;
    const colors={1:'#1976d2',2:'#388e3c',3:'#d32f2f',4:'#7b1fa2',5:'#ff8f00',6:'#0097a7',7:'#5d4037',8:'#616161'};
    const bg=cssVar('--surface-container'),bgHover=cssVar('--surface-container-high'),
          bgRevealed=cssVar('--surface-container-lowest'),
          mineBg=cssVar('--error-container');
    let html='';
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
      const key=i+'-'+j;
      let cls='mine-cell',content='',style=`background:${bg};`;
      if(revealed[i][j]){
        if(board[i][j]===-1){cls+=' mine';content='💣';style=`background:${mineBg};`;}
        else if(board[i][j]>0){cls+=' revealed';content=board[i][j];style=`background:${bgRevealed};color:${colors[board[i][j]]||'#000'};`;}
        else{cls+=' revealed';style=`background:${bgRevealed};`;}
      }else if(flags[key]){cls+=' flagged';content='🚩';style=`background:${bgHover};`;}
      html+=`<div class="${cls}" data-x="${i}" data-y="${j}" style="${style}">${content}</div>`;
    }
    grid.innerHTML=html;
  }
  window.mineRender=mineRender;

  document.getElementById('mine-grid').addEventListener('click',e=>{
    const cell=e.target.closest('.mine-cell');if(!cell||gameOver||win)return;
    const x=parseInt(cell.dataset.x),y=parseInt(cell.dataset.y);
    if(flags[x+'-'+y])return;
    if(flagMode){toggleFlag(x,y);return;}
    if(firstClick){placeMines(x,y);firstClick=false;}
    reveal(x,y);
  });

  document.getElementById('mine-grid').addEventListener('contextmenu',e=>{
    e.preventDefault();const cell=e.target.closest('.mine-cell');if(!cell||gameOver)return;
    toggleFlag(parseInt(cell.dataset.x),parseInt(cell.dataset.y));
  });

  function toggleFlag(x,y){
    if(revealed[x][y])return;
    const key=x+'-'+y;
    if(flags[key])delete flags[key];else flags[key]=true;
    document.getElementById('flag-count').textContent=Object.keys(flags).length;
    mineRender();
  }

  document.getElementById('flag-btn').addEventListener('click',()=>{
    flagMode=!flagMode;
    document.getElementById('flag-btn').textContent=flagMode?'🚩 标记模式 (开)':'🚩 标记模式 (关)';
  });

  document.getElementById('mine-restart').addEventListener('click',init);
  init();
})();

/* =================================================================
   五子棋（本地双人对弈）
   ================================================================= */
(function(){
  const SIZE=15,CELL=28,PADDING=20;
  let board=[],turn=1,gameOver=false,moveCount=0;
  const canvas=document.getElementById('gomo-canvas'),ctx=canvas.getContext('2d');

  function gomoInit(){
    board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    turn=1;gameOver=false;moveCount=0;
    document.getElementById('gomo-turn').textContent='⚫ 黑棋';
    document.getElementById('gomo-status').textContent='';
    gomoDraw();
  }
  window.gomoInit=gomoInit;

  window.gomoDraw=function(){
    const w=canvas.width;
    ctx.fillStyle='#dcb35c';ctx.fillRect(0,0,w,w);
    ctx.strokeStyle='#8b6914';ctx.lineWidth=1;
    for(let i=0;i<SIZE;i++){
      const p=PADDING+i*CELL;
      ctx.beginPath();ctx.moveTo(PADDING,p);ctx.lineTo(w-PADDING,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PADDING);ctx.lineTo(p,w-PADDING);ctx.stroke();
    }
    ctx.fillStyle='#8b6914';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(PADDING+x*CELL,PADDING+y*CELL,3,0,Math.PI*2);ctx.fill();
    });
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(board[r][c]===0)continue;
      const x=PADDING+c*CELL,y=PADDING+r*CELL;
      ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.arc(x,y,CELL/2-2,0,Math.PI*2);
      if(board[r][c]===1){ctx.fillStyle='#1a1a1a';ctx.fill();}
      else{ctx.fillStyle='#f5f5f5';ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();}
    }
    ctx.shadowBlur=0;
  };

  function checkWin(r,c,p){
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(const [dr,dc]of dirs){
      let cnt=1;
      for(let d=1;d<5;d++){const nr=r+dr*d,nc=c+dc*d;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===p)cnt++;else break}
      for(let d=1;d<5;d++){const nr=r-dr*d,nc=c-dc*d;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===p)cnt++;else break}
      if(cnt>=5)return true;
    }
    return false;
  }

  canvas.addEventListener('click',e=>{
    if(gameOver)return;
    const rect=canvas.getBoundingClientRect(),scale=canvas.width/rect.width;
    const x=Math.round((e.clientX-rect.left)*scale),y=Math.round((e.clientY-rect.top)*scale);
    const c=Math.round((x-PADDING)/CELL),r=Math.round((y-PADDING)/CELL);
    if(r<0||r>=SIZE||c<0||c>=SIZE||board[r][c]!==0)return;
    board[r][c]=turn;moveCount++;
    gomoDraw();
    if(checkWin(r,c,turn)){
      gameOver=true;
      const winner=turn===1?'⚫ 黑棋':'⚪ 白棋';
      document.getElementById('gomo-status').textContent='🎉 '+winner+' 获胜！(共'+moveCount+'步)';
      return;
    }
    turn=turn===1?2:1;
    document.getElementById('gomo-turn').textContent=turn===1?'⚫ 黑棋':'⚪ 白棋';
  });

  document.getElementById('gomo-restart').addEventListener('click',gomoInit);
  gomoInit();
})();

/* =================================================================
   电子木鱼
   ================================================================= */
(function(){
  const KEY='monolith.woodenFish';
  let total=0,today=0;

  const PHRASES=[
    '功德 +1 🙏','心静自然凉','善哉善哉','一切随缘','放下执念',
    '阿弥陀佛','随喜赞叹','心平气和','四大皆空','福报深厚',
    '歇即菩提','本来无一物','万事随缘了','一花一世界','善有善报',
    '平常心是道','福慧双修','功德无量','心生欢喜','缘起性空',
  ];

  function load(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'{}');
      total=raw.total||0;
      const todayKey=new Date().toISOString().slice(0,10);
      today=raw[todayKey]||0;
    }catch(e){total=0;today=0}
    updateUI();
  }

  function save(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'{}')||{};
      const todayKey=new Date().toISOString().slice(0,10);
      raw.total=total;raw[todayKey]=today;
      localStorage.setItem(KEY,JSON.stringify(raw));
    }catch(e){}
  }

  function updateUI(){
    document.getElementById('deed').textContent=total;
    document.getElementById('wf-today').textContent=today;
  }

  function knock(){
    total++;today++;
    const fish=document.getElementById('fish');
    fish.classList.add('hit');
    setTimeout(()=>fish.classList.remove('hit'),120);
    const p=document.getElementById('wf-phrase');
    p.classList.add('fade');
    setTimeout(()=>{
      p.textContent=PHRASES[Math.floor(Math.random()*PHRASES.length)];
      p.classList.remove('fade');
    },100);
    updateUI();
    save();
  }

  // 图片优先，emoji 兜底
  const fishEl=document.getElementById('fish');
  const img=new Image();
  img.onload=()=>{fishEl.innerHTML='<img src="assets/images/wooden-fish.png" alt="木鱼">';};
  img.onerror=()=>{fishEl.textContent='🐟';};
  img.src='assets/images/wooden-fish.png';

  document.getElementById('fish-wrap').addEventListener('click',knock);
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('tab-wooden-fish').classList.contains('active'))return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();knock()}
  });
  document.getElementById('wf-reset').addEventListener('click',()=>{
    if(!confirm('确定要重置总功德吗？'))return;
    total=0;today=0;try{localStorage.setItem(KEY,JSON.stringify({total:0}));}catch(e){}
    updateUI();
    document.getElementById('wf-phrase').textContent='功德已清零，从头再来 🙏';
  });
  load();
})();
</script>
</body>
</html>
