<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>五子棋 · 摸鱼小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;min-height:100vh;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;padding:16px}
.game-card{background:var(--surface-container-low);border-radius:var(--r-xl);padding:24px;max-width:540px;width:100%;text-align:center}
h2{font-size:22px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px}
#info{font-size:14px;color:var(--on-surface-variant);margin-bottom:8px}
canvas{display:block;margin:0 auto;border-radius:var(--r-lg);max-width:100%;cursor:pointer;touch-action:manipulation;background:#dcb35c}
#status{font-size:15px;font-weight:500;min-height:24px;margin-top:10px;color:var(--primary)}
.controls{margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.back-link{text-decoration:none;color:var(--on-surface-variant);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.back-link:hover{color:var(--primary)}
</style>
</head>
<body>
<div class="game-card">
  <h2><span class="material-symbols-outlined" style="font-size:28px;">circle</span>五子棋</h2>
  <p id="info">当前：<span class="font-semibold" id="turn-text">⚫ 黑棋</span></p>
  <canvas id="board" width="480" height="480"></canvas>
  <p id="status"></p>
  <div class="controls">
    <button id="restart-btn" class="btn-primary text-sm py-2 px-6">重新开始</button>
  </div>
  <a href="games.html" class="back-link"><span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>返回游戏大厅</a>
</div>
<script>
(function(){
  const SIZE=15,CELL=32,PADDING=24;
  let board=[],turn=1,gameOver=false,moveCount=0;
  const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');

  function init(){
    board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    turn=1;gameOver=false;moveCount=0;
    document.getElementById('turn-text').textContent='⚫ 黑棋';
    document.getElementById('status').textContent='';
    draw();
  }

  function draw(){
    const w=canvas.width;
    ctx.clearRect(0,0,w,w);
    // Background
    ctx.fillStyle='#dcb35c';ctx.fillRect(0,0,w,w);
    // Grid lines
    ctx.strokeStyle='#8b6914';ctx.lineWidth=1;
    for(let i=0;i<SIZE;i++){
      const p=PADDING+i*CELL;
      ctx.beginPath();ctx.moveTo(PADDING,p);ctx.lineTo(w-PADDING,p);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p,PADDING);ctx.lineTo(p,w-PADDING);ctx.stroke();
    }
    // Star points
    ctx.fillStyle='#8b6914';
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(PADDING+x*CELL,PADDING+y*CELL,3,0,Math.PI*2);ctx.fill();
    });
    // Pieces
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(board[r][c]===0)continue;
      const x=PADDING+c*CELL,y=PADDING+r*CELL;
      ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.arc(x,y,CELL/2-2,0,Math.PI*2);
      if(board[r][c]===1){ctx.fillStyle='#1a1a1a';ctx.fill();}
      else{ctx.fillStyle='#f5f5f5';ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();}
    }
    ctx.shadowBlur=0;
  }

  function checkWin(r,c,p){
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(const [dr,dc]of dirs){
      let cnt=1;
      for(let d=1;d<5;d++){const nr=r+dr*d,nc=c+dc*d;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===p)cnt++;else break}
      for(let d=1;d<5;d++){const nr=r-dr*d,nc=c-dc*d;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===p)cnt++;else break}
      if(cnt>=5)return true;
    }
    return false;
  }

  canvas.addEventListener('click',e=>{
    if(gameOver)return;
    const rect=canvas.getBoundingClientRect(),scale=canvas.width/rect.width;
    const x=Math.round((e.clientX-rect.left)*scale),y=Math.round((e.clientY-rect.top)*scale);
    const c=Math.round((x-PADDING)/CELL),r=Math.round((y-PADDING)/CELL);
    if(r<0||r>=SIZE||c<0||c>=SIZE||board[r][c]!==0)return;
    board[r][c]=turn;moveCount++;
    draw();
    if(checkWin(r,c,turn)){
      gameOver=true;
      const winner=turn===1?'⚫ 黑棋':'⚪ 白棋';
      document.getElementById('status').textContent='🎉 '+winner+' 获胜！(共'+moveCount+'步)';
      return;
    }
    turn=turn===1?2:1;
    document.getElementById('turn-text').textContent=turn===1?'⚫ 黑棋':'⚪ 白棋';
  });

  document.getElementById('restart-btn').addEventListener('click',init);
  window.addEventListener('load',init);
})();
</script>
</body>
</html>
