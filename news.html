<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日热点资讯 · My Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
      <span class="font-semibold text-lg tracking-tight whitespace-nowrap">My Work</span>
    </div>
    <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
      <div class="header-ticker w-full max-w-xl" id="header-ticker">
        <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
        <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
      </button>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <!-- ===== Sidebar (injected by sidebar.js) ===== -->
  <aside class="app-sidebar"></aside>

  <main class="app-main dot-bg">
    <section class="mb-6 fade-in flex items-end justify-between flex-wrap gap-4">
      <div>
        <p class="eyebrow mb-2 flex items-center gap-2">
          <span class="material-symbols-outlined text-base">bolt</span> AI Pulse
        </p>
        <h1 class="headline-xl mb-2" data-i18n="newsTitle">今日热点资讯</h1>
        <p class="body-lg text-on-surface-variant max-w-2xl" data-i18n="newsDesc">
          实时追踪全球人工智能领域最具影响力的技术突破与商业变革。
        </p>
      </div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        <button class="chip active filter-chip" data-cat="全部" data-i18n="newsCatAll">全部</button>
        <button class="chip filter-chip" data-cat="技术" data-i18n="newsCatTech">技术</button>
        <button class="chip filter-chip" data-cat="商业" data-i18n="newsCatBiz">商业</button>
        <button class="chip filter-chip" data-cat="研究">研究</button>
        <button class="chip filter-chip" data-cat="产品">产品</button>
      </div>
    </section>

    <div id="news-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <p class="text-center text-xs text-on-surface-variant tracking-widest uppercase mt-10">FETCHING DEEPER INSIGHTS</p>
  </main>

  <script src="assets/sidebar.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // 从 assets/news.json 加载（由 GitHub Actions 每天北京时间 9:00 自动抓取）
    (async () => {
      const list = document.getElementById('news-list');
      let news = [];
      let lastUpdated = '';
      let sourceLabel = '';

      // 本地隐藏：被用户删除的新闻 link 集合。
      // 按日期隔离（monolith.news.hidden.YYYY-MM-DD），每天独立计数，
      // 避免跨天累积导致同一条新闻永远隐藏、列表越显越少。
      const _todayKey = new Date().toISOString().slice(0, 10);
      const _hiddenStoreKey = 'monolith.news.hidden.' + _todayKey;
      let hidden = new Set();
      try { hidden = new Set(JSON.parse(localStorage.getItem(_hiddenStoreKey) || '[]')); } catch(e) {}
      function persistHidden() { try { localStorage.setItem(_hiddenStoreKey, JSON.stringify([...hidden])); } catch(e) {} }
      // 清理旧数据：删除无日期的旧 key 和 7 天前的日期 key（避免 localStorage 膨胀）
      try {
        const oldKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('monolith.news.hidden')) oldKeys.push(k);
        }
        const cutoff = Date.now() - 7 * 86400000;
        oldKeys.forEach(k => {
          const keep = k === _hiddenStoreKey;
          if (!keep && k === 'monolith.news.hidden') { localStorage.removeItem(k); return; }
          const d = k.replace('monolith.news.hidden.', '');
          if (!keep && /^\d{4}-\d{2}-\d{2}$/.test(d) && new Date(d + 'T00:00:00Z').getTime() < cutoff) {
            localStorage.removeItem(k);
          }
        });
      } catch(e) {}

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }

      function newsCard(n) {
        return '<article class="card hover-lift fade-in flex flex-col gap-4" style="padding: 24px;">' +
          '<div class="flex items-center justify-between">' +
            '<span class="chip">' + n.tag + '</span>' +
            '<span class="text-xs text-on-surface-variant">' + n.time + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-3">' +
            '<div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background: var(--surface-container);">' +
              '<span class="material-symbols-outlined" style="font-size: 22px; color: var(--on-surface-variant);">' + n.icon + '</span>' +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<p class="text-xs font-mono uppercase tracking-widest text-on-surface-variant">' + n.category + ' · ' + n.source + '</p>' +
            '</div>' +
          '</div>' +
          '<h3 class="text-lg font-semibold leading-snug" style="color: var(--on-surface);">' + escapeHtml(n.title) + '</h3>' +
          '<p class="text-sm leading-relaxed line-clamp-3" style="color: var(--on-surface-variant);">' + escapeHtml(n.excerpt) + '</p>' +
          '<div class="flex items-center justify-between mt-auto pt-3" style="border-top: 1px solid var(--outline-variant);">' +
            '<a href="' + escapeHtml(n.link) + '" target="_blank" rel="noopener noreferrer" class="text-xs text-on-surface-variant hover:text-on-surface no-underline">阅读全文 →</a>' +
            '<div class="flex gap-1">' +
              '<button class="p-1.5 hover:bg-surface-container rounded-full transition-colors" aria-label="收藏"><span class="material-symbols-outlined" style="font-size:18px;">bookmark</span></button>' +
              '<button class="p-1.5 hover:bg-surface-container rounded-full transition-colors" aria-label="分享"><span class="material-symbols-outlined" style="font-size:18px;">share</span></button>' +
              '<button class="news-delete p-1.5 hover:bg-surface-container rounded-full transition-colors text-on-surface-variant" data-link="' + escapeHtml(n.link) + '" aria-label="删除"><span class="material-symbols-outlined" style="font-size:18px;">delete</span></button>' +
            '</div>' +
          '</div>' +
        '</article>';
      }

      function applyFilter(cat) {
        list.querySelectorAll('article').forEach((el, i) => {
          const show = cat === '全部' || (news[i] && news[i].category === cat);
          el.style.display = show ? '' : 'none';
        });
      }

      function render() {
        list.innerHTML = news.length ? news.map(newsCard).join('') :
          '<p class="text-center text-on-surface-variant col-span-full py-10">暂无资讯数据。</p>';
        updateTimestamp();
      }

      function updateTimestamp() {
        let el = document.getElementById('news-updated');
        if (!el) {
          el = document.createElement('p');
          el.id = 'news-updated';
          el.className = 'text-xs text-on-surface-variant text-center mt-4';
          list.parentElement.insertBefore(el, list.nextSibling);
        }
        el.innerHTML = sourceLabel ? '来源：<span class="font-medium">' + escapeHtml(sourceLabel) + '</span> · 最后更新：' + escapeHtml(lastUpdated) : '最后更新：' + escapeHtml(lastUpdated);
      }

      async function load(bust) {
        const url = 'assets/news.json' + (bust ? ('?t=' + Date.now()) : '');
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        news = (data.items || []).filter(n => !hidden.has(n.link));
        lastUpdated = data.updated_at_local || data.updated_at || '';
        sourceLabel = data.source_label || '';
        render();
      }

      // 绑定筛选
      document.querySelectorAll('.filter-chip').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
          applyFilter(c.dataset.cat || c.textContent.trim());
        });
      });

      // 删除单条新闻（本地隐藏）
      list.addEventListener('click', e => {
        const del = e.target.closest('.news-delete');
        if (!del) return;
        const link = del.dataset.link;
        hidden.add(link);
        persistHidden();
        news = news.filter(n => n.link !== link);
        render();
      });

      // 加载
      try {
        await load(false);
      } catch (e) {
        console.error('Failed to load news:', e);
        list.innerHTML = '<p class="text-center text-on-surface-variant col-span-full py-10">' + (((window.I18N||{})[window.getCurrentLang?window.getCurrentLang():'zh']||{}).newsLoadFail || '资讯加载失败，请稍后再试。') + '<br/><span class="text-xs">' + e.message + '</span></p>';
      }

      // 手动刷新按钮（强制绕过缓存）
      const header = document.querySelector('.eyebrow');
      const refreshBtn = document.createElement('button');
      const dictN=(window.I18N||{})[window.getCurrentLang?window.getCurrentLang():'zh']||{};
      refreshBtn.className = 'chip ml-auto flex items-center gap-1';
      const refreshTxt = dictN.refresh || '刷新';
      refreshBtn.innerHTML = `<span class="material-symbols-outlined text-sm">refresh</span> ${refreshTxt}`;
      refreshBtn.addEventListener('click', async () => {
        refreshBtn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">refresh</span> ${dictN.refreshing || '刷新中...'}`;
        try {
          await load(true);
        } catch (e) {
          console.error(e);
        }
        refreshBtn.innerHTML = '<span class="material-symbols-outlined text-sm">refresh</span> 刷新';
        refreshBtn.animate([{transform:'rotate(360deg)'}], {duration:300});
      });
      header.parentElement.appendChild(refreshBtn);
    })();
  </script>

  <style>
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .gap-5 { gap: 20px; }
    .gap-6 { gap: 24px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-8 { margin-bottom: 32px; }
    .mt-auto { margin-top: auto; }
    .mt-10 { margin-top: 40px; }
    .pt-3 { padding-top: 12px; }
    .pt-4 { padding-top: 16px; }
    .p-2 { padding: 8px; }
    .p-8 { padding: 32px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .text-base { font-size: 16px; }
    .text-lg { font-size: 18px; }
    .text-2xl { font-size: 24px; }
    .text-on-surface { color: var(--on-surface); }
    .text-on-surface-variant { color: var(--on-surface-variant); }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .rounded-full { border-radius: 9999px; }
    .rounded-xl { border-radius: var(--r-xl); }
    .border-outline-variant { border-color: var(--outline-variant); }
    .border-outline-variant\/30 { border-color: rgba(207, 196, 197, 0.3); }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    @media (min-width: 768px) { .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .md\:hidden { display: none; } }
    @media (min-width: 1024px) { .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .h-8 { height: 32px; }
    .w-8 { width: 32px; }
    .w-10 { width: 40px; }
    .h-10 { height: 40px; }
    .max-w-xl { max-width: 576px; }
    .max-w-2xl { max-width: 672px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .text-center { text-align: center; }
    .leading-snug { line-height: 1.375; }
    .leading-relaxed { line-height: 1.625; }
    .tracking-tight { letter-spacing: -0.02em; }
    .tracking-widest { letter-spacing: 0.2em; }
    .uppercase { text-transform: uppercase; }
    .transition-colors { transition: color 0.2s, background 0.2s, border 0.2s; }
    .ml-auto { margin-left: auto; }
    .min-w-0 { min-width: 0; }
    .shrink-0 { flex-shrink: 0; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .top-4 { top: 16px; }
    .left-4 { left: 16px; }
    .right-4 { right: 16px; }
    .bottom-4 { bottom: 16px; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-t { border-top-width: 1px; border-top-style: solid; }

    /* 顶栏 ticker — 防止被某些样式覆盖 */
    .header-ticker {
      position: relative;
      overflow: hidden;
      height: 32px;
      min-height: 32px;
    }
    .ticker-item {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }
    .ticker-item.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</body>
</html>
