<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>贪吃蛇 · 摸鱼小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;min-height:100vh;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;padding:16px}
.game-card{background:var(--surface-container-low);border-radius:var(--r-xl);padding:24px;max-width:520px;width:100%;text-align:center}
h2{font-size:22px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px}
#score{font-size:14px;color:var(--on-surface-variant);margin-bottom:16px}
canvas{display:block;margin:0 auto;background:var(--surface-container);border-radius:var(--r-lg);max-width:100%;touch-action:none}
.controls{margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#status{font-size:15px;font-weight:500;margin-top:12px;min-height:24px;color:var(--primary)}
.back-link{text-decoration:none;color:var(--on-surface-variant);font-size:13px;display:inline-flex;align-items:center;gap:4px}
.back-link:hover{color:var(--primary)}
</style>
</head>
<body>
<div class="game-card">
  <h2><span class="material-symbols-outlined" style="font-size:28px;">kebab_dining</span>贪吃蛇</h2>
  <p id="score">当前得分：0 &nbsp;|&nbsp; 最高纪录：<span id="best">0</span></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <button id="restart-btn" class="btn-primary text-sm py-2 px-6">重新开始</button>
  </div>
  <p id="status"></p>
  <a href="games.html" class="back-link"><span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>返回游戏大厅</a>
</div>
<script>
(function(){
  const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  const CELL=20,ROWS=20,COLS=20,TICK=180;
  let snake,direction,nextDir,food,score,gameOver,loop,best;

  function init(){
    snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    direction={x:1,y:0};nextDir={x:1,y:0};score=0;gameOver=false;
    spawnFood();
    best=parseInt(localStorage.getItem('monolith.snakeBest')||'0');
    document.getElementById('best').textContent=best;
    document.getElementById('score').textContent='当前得分：0 | 最高纪录：'+best;
    document.getElementById('status').textContent='按方向键开始';
    if(loop){clearInterval(loop)}
    draw();
    clearInterval(loop);
    loop=setInterval(tick,TICK);
  }

  function spawnFood(){
    let pos;do{
      pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    }while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
    food=pos;
  }

  function tick(){
    if(gameOver)return;
    direction={...nextDir};
    const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver=true;document.getElementById('status').textContent='💀 游戏结束！得分：'+score;
      clearInterval(loop);
      if(score>best){best=score;localStorage.setItem('monolith.snakeBest',String(best));document.getElementById('best').textContent=best}
      draw();return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score++;spawnFood();document.getElementById('score').textContent='当前得分：'+score+' | 最高纪录：'+best}
    else snake.pop();
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,400,400);
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
      if((i+j)%2===0)ctx.fillStyle='var(--surface-container)';else ctx.fillStyle='var(--surface)';
      ctx.fillRect(j*CELL,i*CELL,CELL,CELL);
    }
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?'var(--primary)':'var(--on-surface-variant)';
      ctx.shadowBlur=i===0?8:0;ctx.shadowColor='var(--primary)';
      ctx.beginPath();ctx.arc(s.x*CELL+10,s.y*CELL+10,9,0,Math.PI*2);ctx.fill();
    });
    ctx.shadowBlur=0;
    ctx.fillStyle='var(--error)';
    ctx.beginPath();ctx.arc(food.x*CELL+10,food.y*CELL+10,8,0,Math.PI*2);ctx.fill();
  }

  document.addEventListener('keydown',e=>{
    const ks={'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1},'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0}};
    if(ks[e.key]){
      e.preventDefault();
      if(direction.x+ks[e.key].x!==0||direction.y+ks[e.key].y!==0)nextDir=ks[e.key];
    }
  });
  // Swipe support for mobile
  let sx=0,sy=0;
  canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
  canvas.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    let d;if(Math.abs(dx)>Math.abs(dy))d=dx>0?{x:1,y:0}:{x:-1,y:0};else d=dy>0?{x:0,y:1}:{x:0,y:-1};
    if(direction.x+d.x!==0||direction.y+d.y!==0)nextDir=d;
  });
  document.getElementById('restart-btn').addEventListener('click',init);
  window.addEventListener('load',init);
})();
</script>
</body>
</html>
