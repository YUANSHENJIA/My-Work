<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搞钱方法 · My Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="flex items-center gap-2">
      <button data-nav-toggle class="nav-toggle p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <img src="assets/images/avatar.jpg" alt="头像" class="w-8 h-8 rounded-full object-cover shrink-0" />
      <span class="font-semibold text-lg tracking-tight whitespace-nowrap">My Work</span>
    </div>
    <div class="flex-1 mx-auto flex justify-center overflow-hidden px-4">
      <div class="header-ticker w-full max-w-xl" id="header-ticker">
        <p class="body-md text-on-surface-variant">悟已往之不谏，知来者之可追。</p>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button data-theme-toggle class="p-2 rounded-full hover:bg-surface-container transition-colors" aria-label="主题切换">
        <span class="material-symbols-outlined text-on-surface-variant">light_mode</span>
      </button>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <!-- ===== Sidebar (injected by sidebar.js) ===== -->
  <aside class="app-sidebar"></aside>

  <main class="app-main dot-bg">
    <section class="mb-6 fade-in flex items-end justify-between flex-wrap gap-4">
      <div>
        <p class="eyebrow mb-2">Strategy Archive</p>
        <h1 class="headline-xl mb-2">搞钱方法</h1>
        <p class="body-lg text-on-surface-variant max-w-2xl">
          捕捉灵感，拆解逻辑，将构想转化为可持续的复利增长。
        </p>
      </div>
      <button class="btn-primary" onclick="document.getElementById('new-strategy-modal').showModal()">
        <span class="material-symbols-outlined">add</span>
        <span>新增策略</span>
      </button>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Main: empty or strategy list -->
      <div class="lg:col-span-2">
        <!-- Empty state -->
        <section id="empty-state" class="card flex flex-col items-center justify-center py-20 fade-in" style="background-image: radial-gradient(var(--outline-variant) 0.5px, transparent 0.5px); background-size: 16px 16px;">
          <div class="w-20 h-20 rounded-full flex items-center justify-center mb-4" style="background: var(--surface-container-low);">
            <span class="material-symbols-outlined text-4xl text-on-surface-variant">savings</span>
          </div>
          <h2 class="headline-lg mb-3">虚位以待</h2>
          <p class="text-on-surface-variant max-w-md text-center mb-6">
            目前还没有记录任何商业灵感。点击右上角按钮，开始记录你的第一个"搞钱"计划。
          </p>
          <div class="flex items-center gap-2">
            <div class="flex flex-col items-center gap-2 px-4">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: var(--surface-container-low);">
                <span class="material-symbols-outlined text-on-surface-variant">lightbulb</span>
              </div>
              <p class="text-xs text-on-surface-variant">捕捉灵感</p>
            </div>
            <div class="w-12 h-px" style="background: var(--outline-variant);"></div>
            <div class="flex flex-col items-center gap-2 px-4">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: var(--surface-container-low);">
                <span class="material-symbols-outlined text-on-surface-variant">psychology</span>
              </div>
              <p class="text-xs text-on-surface-variant">逻辑拆解</p>
            </div>
            <div class="w-12 h-px" style="background: var(--outline-variant);"></div>
            <div class="flex flex-col items-center gap-2 px-4">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: var(--surface-container-low);">
                <span class="material-symbols-outlined text-on-surface-variant">trending_up</span>
              </div>
              <p class="text-xs text-on-surface-variant">落地执行</p>
            </div>
          </div>
        </section>

        <!-- Strategies list (hidden by default) -->
        <section id="strategies-list" class="flex flex-col gap-4" style="display: none;"></section>
      </div>

      <!-- Sidebar: Daily quote + stats -->
      <aside class="flex flex-col gap-6">
        <div class="card p-8" style="background: var(--primary); color: var(--on-primary); border: none;">
          <p class="eyebrow mb-4" style="color: rgba(255,255,255,0.5);">DAILY QUOTE</p>
          <p class="text-2xl font-semibold leading-snug mb-4">"财富是思考的副产品。"</p>
          <p class="text-sm font-mono" style="color: rgba(255,255,255,0.5);">— 纳瓦尔·拉维康特</p>
        </div>

        <div class="card">
          <p class="eyebrow mb-2">库中策略</p>
          <p class="text-5xl font-semibold mb-4"><span id="strat-count">0</span><span class="text-base ml-2 text-on-surface-variant">个项目</span></p>
          <div class="pt-4" style="border-top: 1px solid var(--outline-variant);">
            <div class="flex items-center justify-between">
              <p class="text-sm text-on-surface-variant">最近更新</p>
              <p class="text-xs font-mono" id="last-updated">— / — / —</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- New strategy modal -->
    <dialog id="new-strategy-modal" class="rounded-2xl p-0 max-w-md w-full" style="background: var(--surface-container-lowest); border: 1px solid var(--outline-variant);">
      <form id="strat-form" method="dialog" class="p-6 flex flex-col gap-4">
        <h3 class="headline-lg">新增策略</h3>
        <input type="text" id="strat-title" placeholder="策略名称" required class="px-4 py-3 rounded-xl outline-none" style="background: var(--surface-container-low); color: var(--on-surface); border: 1px solid var(--outline-variant);">
        <textarea id="strat-content" placeholder="拆解逻辑 / 行动清单..." rows="5" required class="px-4 py-3 rounded-xl outline-none resize-none" style="background: var(--surface-container-low); color: var(--on-surface); border: 1px solid var(--outline-variant);"></textarea>
        <div class="flex items-center gap-2">
          <select id="strat-tag" class="px-3 py-2 rounded-lg text-sm" style="background: var(--surface-container-low); border: 1px solid var(--outline-variant);">
            <option value="income">收入</option>
            <option value="side-project">副业</option>
            <option value="investment">投资</option>
            <option value="skill">技能变现</option>
          </select>
          <div class="flex-1"></div>
          <button type="button" onclick="document.getElementById('new-strategy-modal').close()" class="btn-secondary text-sm py-2 px-4">取消</button>
          <button type="submit" class="btn-primary text-sm py-2 px-4">保存</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="assets/sidebar.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const STORAGE_KEY = 'monolith.strategies';

    function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
    function save(list) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e) {} }

    let strategies = load();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    const tagLabels = {
      'income': 'INCOME',
      'side-project': 'SIDE PROJECT',
      'investment': 'INVESTMENT',
      'skill': 'SKILL MONETIZE'
    };

    function render() {
      const list = document.getElementById('strategies-list');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('strat-count');
      const last = document.getElementById('last-updated');

      count.textContent = strategies.length;

      if (strategies.length === 0) {
        list.style.display = 'none';
        empty.style.display = '';
        last.textContent = '— / — / —';
        return;
      }

      empty.style.display = 'none';
      list.style.display = '';
      const newest = Math.max(...strategies.map(s => s.createdAt));
      last.textContent = new Date(newest).toLocaleDateString('zh-CN');

      list.innerHTML = strategies.map(s => `
        <article class="card hover-lift">
          <div class="flex items-start justify-between gap-4 mb-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-xl font-semibold mb-1 leading-snug">${escapeHtml(s.title)}</h3>
              <div class="flex items-center gap-2 text-xs">
                <span class="chip">${tagLabels[s.tag] || s.tag}</span>
                <span class="text-on-surface-variant font-mono">${new Date(s.createdAt).toLocaleDateString('zh-CN')}</span>
              </div>
            </div>
            <button class="remove-strat p-2 hover:bg-surface-container rounded-full transition-colors text-on-surface-variant" data-id="${s.id}" aria-label="删除">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
          <p class="text-base text-on-surface-variant leading-relaxed line-clamp-3">${escapeHtml(s.content)}</p>
        </article>
      `).join('');
    }

    document.getElementById('strat-form').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('strat-title').value.trim();
      const content = document.getElementById('strat-content').value.trim();
      const tag = document.getElementById('strat-tag').value;
      if (!title || !content) return;
      strategies.unshift({ id: 's' + Date.now(), title, content, tag, createdAt: Date.now() });
      save(strategies);
      document.getElementById('new-strategy-modal').close();
      document.getElementById('strat-title').value = '';
      document.getElementById('strat-content').value = '';
      render();
    });

    document.getElementById('strategies-list').addEventListener('click', e => {
      const btn = e.target.closest('.remove-strat');
      if (!btn) return;
      const id = btn.dataset.id;
      strategies = strategies.filter(s => s.id !== id);
      save(strategies);
      render();
    });

    render();
  </script>

  <style>
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .mb-8 { margin-bottom: 32px; }
    .p-2 { padding: 8px; }
    .p-6 { padding: 24px; }
    .p-8 { padding: 32px; }
    .px-3 { padding-left: 12px; padding-right: 12px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-2 { padding-top: 8px; padding-bottom: 8px; }
    .py-3 { padding-top: 12px; padding-bottom: 12px; }
    .py-12 { padding-top: 48px; padding-bottom: 48px; }
    .py-20 { padding-top: 80px; padding-bottom: 80px; }
    .pt-4 { padding-top: 16px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .text-base { font-size: 16px; }
    .text-lg { font-size: 18px; }
    .text-xl { font-size: 20px; }
    .text-2xl { font-size: 24px; }
    .text-4xl { font-size: 36px; }
    .text-5xl { font-size: 48px; }
    .text-on-surface { color: var(--on-surface); }
    .text-on-surface-variant { color: var(--on-surface-variant); }
    .text-primary { color: var(--primary); }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .rounded-full { border-radius: 9999px; }
    .rounded-lg { border-radius: var(--r-lg); }
    .rounded-xl { border-radius: var(--r-xl); }
    .rounded-2xl { border-radius: 16px; }
    .border { border-width: 1px; border-style: solid; }
    .border-none { border: none; }
    .border-outline-variant { border-color: var(--outline-variant); }
    .border-outline-variant\/30 { border-color: rgba(207, 196, 197, 0.3); }
    .bg-surface-container { background: var(--surface-container); }
    .bg-primary { background: var(--primary); }
    .w-8 { width: 32px; }
    .h-8 { height: 32px; }
    .w-12 { width: 48px; }
    .h-12 { height: 48px; }
    .w-20 { width: 80px; }
    .h-20 { height: 80px; }
    .w-full { width: 100%; }
    .max-w-md { max-width: 448px; }
    .max-w-2xl { max-width: 672px; }
    .max-w-xl { max-width: 576px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    @media (min-width: 1024px) { .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lg\:col-span-2 { grid-column: span 2 / span 2; } }
    .text-center { text-align: center; }
    .tracking-tight { letter-spacing: -0.02em; }
    .tracking-widest { letter-spacing: 0.2em; }
    .uppercase { text-transform: uppercase; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .leading-snug { line-height: 1.375; }
    .leading-relaxed { line-height: 1.625; }
    .transition-colors { transition: color 0.2s, background 0.2s, border 0.2s; }
    .cursor-pointer { cursor: pointer; }
    .outline-none { outline: none; }
    .resize-none { resize: none; }
    .shrink-0 { flex-shrink: 0; }
    .min-w-0 { min-width: 0; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-t { border-top-width: 1px; border-top-style: solid; }
    dialog { padding: 0; border: none; }
    dialog::backdrop { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
    @media (min-width: 768px) { .md\:hidden { display: none; } }
  </style>
</body>
</html>
