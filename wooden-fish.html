<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>电子木鱼 · 摸鱼小游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;min-height:100vh;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;padding:16px}
.game-card{background:var(--surface-container-low);border-radius:var(--r-xl);padding:32px;max-width:420px;width:100%;text-align:center}
h2{font-size:22px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
#fish-wrap{position:relative;width:200px;height:200px;margin:0 auto 20px;cursor:pointer;touch-action:manipulation;user-select:none}
#fish{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;transition:transform .12s;box-shadow:0 8px 24px rgba(239,68,68,.4)}
#fish:active{transform:scale(.85)}
#fish.hit{transform:scale(.85)}
#deed{font-size:48px;font-weight:800;color:var(--primary);display:block;margin-bottom:4px}
#deed-label{font-size:14px;color:var(--on-surface-variant);margin-bottom:20px}
#phrase{font-size:18px;font-weight:500;color:var(--on-surface);min-height:40px;margin-bottom:8px;transition:opacity .2s}
#phrase.fade{opacity:0}
#btn-area{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.status-bar{font-size:13px;color:var(--on-surface-variant)}
.back-link{text-decoration:none;color:var(--on-surface-variant);font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-top:8px}
.back-link:hover{color:var(--primary)}
</style>
</head>
<body>
<div class="game-card">
  <h2><span class="material-symbols-outlined" style="font-size:28px;">self_improvement</span>电子木鱼</h2>
  <p class="status-bar">今日功德：<span id="today-deed">0</span></p>
  <div id="fish-wrap">
    <div id="fish">🐟</div>
  </div>
  <span id="deed">0</span>
  <span id="deed-label">总功德</span>
  <p id="phrase">点击木鱼，敲一敲 🎵</p>
  <div id="btn-area">
    <button id="reset-btn" class="btn-secondary text-sm py-2 px-4">重置总功德</button>
  </div>
  <a href="games.html" class="back-link"><span class="material-symbols-outlined" style="font-size:14px;">arrow_back</span>返回游戏大厅</a>
</div>
<script>
(function(){
  const KEY='monolith.woodenFish';
  let total=0,today=0;

  const PHRASES=[
    '功德 +1 🙏','心静自然凉','善哉善哉','一切随缘','放下执念',
    '阿弥陀佛','随喜赞叹','心平气和','四大皆空','福报深厚',
    '歇即菩提','本来无一物','万事随缘了','一花一世界','善有善报',
    '平常心是道','福慧双修','功德无量','心生欢喜','缘起性空',
  ];

  function load(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'{}');
      total=raw.total||0;
      const todayKey=new Date().toISOString().slice(0,10);
      today=raw[todayKey]||0;
    }catch(e){total=0;today=0}
    updateUI();
  }

  function save(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'{}')||{};
      const todayKey=new Date().toISOString().slice(0,10);
      raw.total=total;
      raw[todayKey]=today;
      localStorage.setItem(KEY,JSON.stringify(raw));
    }catch(e){}
  }

  function updateUI(){
    document.getElementById('deed').textContent=total;
    document.getElementById('today-deed').textContent=today;
  }

  function knock(){
    total++;today++;
    const fish=document.getElementById('fish');
    fish.classList.add('hit');
    setTimeout(()=>fish.classList.remove('hit'),120);
    // Show random phrase
    const p=document.getElementById('phrase');
    p.classList.add('fade');
    setTimeout(()=>{
      p.textContent=PHRASES[Math.floor(Math.random()*PHRASES.length)];
      p.classList.remove('fade');
    },100);
    updateUI();
    save();
  }

  document.getElementById('fish-wrap').addEventListener('click',knock);
  // Space bar support
  document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();knock()}});

  document.getElementById('reset-btn').addEventListener('click',()=>{
    if(!confirm('确定要重置总功德吗？'))return;
    total=0;today=0;
    try{localStorage.setItem(KEY,JSON.stringify({total:0}));}catch(e){}
    updateUI();
    document.getElementById('phrase').textContent='功德已清零，从头再来 🙏';
  });

  load();
})();
</script>
</body>
</html>
